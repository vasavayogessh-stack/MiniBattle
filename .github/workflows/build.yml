
name: MiniBattle Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        
      - name: Extract Android project
        run: |
          unzip -o MiniBattleAndroidProject.zip -d .
          ls -la
          test -d MiniBattleAndroid 
          
      - name: Build APK
        run: |
          cd MiniBattleAndroid
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MiniBattle-APK
          path: MiniBattleAndroid/app/build/outputs/apk/debug/app-debug.apk
